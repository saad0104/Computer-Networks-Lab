<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Text Case Converter</title>
    <style>
      :root {
        --blue: #30b3d4;
        --navy: #12355b;
        --background: #f4f7fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        color: #1d2939;
        background: var(--background);
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        width: min(92%, 620px);
        padding: 2rem;
        border-radius: 16px;
        background: white;
        box-shadow: 0 8px 24px rgba(18, 53, 91, 0.14);
      }

      h1 {
        margin-top: 0;
        color: var(--navy);
      }

      label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: bold;
      }

      textarea {
        width: 100%;
        min-height: 140px;
        padding: 0.85rem;
        border: 1px solid #a9b8ca;
        border-radius: 8px;
        font: inherit;
        resize: vertical;
      }

      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin: 1rem 0;
      }

      button {
        padding: 0.75rem 1.1rem;
        border: 0;
        border-radius: 8px;
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: bold;
        background: var(--blue);
      }

      button:hover {
        background: var(--navy);
      }

      output {
        display: block;
        min-height: 3rem;
        padding: 0.85rem;
        border-left: 4px solid var(--blue);
        border-radius: 4px;
        background: #eaf3ff;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>

  <body>
    <main>
      <h1>Text Case Converter</h1>
      <p>Enter text below, then convert it to uppercase or lowercase.</p>

      <label for="input-text">Your text</label>
      <textarea
        id="input-text"
        placeholder="Write text here..."
      ></textarea>

      <div class="button-row">
        <button id="uppercase-button" type="button">
          Convert to Uppercase
        </button>

        <button id="lowercase-button" type="button">
          Convert to Lowercase
        </button>
      </div>

      <label for="result">Result</label>
      <output id="result" aria-live="polite">
        Your converted text will appear here.
      </output>
    </main>

    <script>
      const inputText = document.getElementById("input-text");
      const result = document.getElementById("result");
      const uppercaseButton = document.getElementById("uppercase-button");
      const lowercaseButton = document.getElementById("lowercase-button");

      uppercaseButton.addEventListener("click", () => {
        result.textContent = inputText.value.toUpperCase();
      });

      lowercaseButton.addEventListener("click", () => {
        result.textContent = inputText.value.toLowerCase();
      });
    </script>
  </body>
</html>
